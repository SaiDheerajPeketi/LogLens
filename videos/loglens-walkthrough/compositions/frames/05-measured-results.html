  <script>
    (() => {
      const byId = (suffix) => document.getElementById(`05-measured-results-${suffix}`);
      const evaluation = byId("evaluation");
      const splitFocus = byId("split-focus");
      const heading = byId("heading");
      const tag = byId("tag");
      const claim = byId("claim");
      const stats = [1, 2, 3, 4].map((index) => byId(`stat-${index}`));
      const values = [1, 2, 3, 4].map((index) => byId(`value-${index}`));
      const fills = [1, 2, 3, 4].map((index) => byId(`fill-${index}`));
      const states = [
        { value: 0 },
        { value: 0 },
        { value: 0 },
        { value: 0 },
      ];
      const targets = [9994, 9956, 2, 10000];
      const proportions = [0.9994, 0.9956, 0.0002, 1];
      const tl = gsap.timeline({ paused: true });

      window.__timelines = window.__timelines || {};
      window.__timelines["05-measured-results"] = tl;

      tl.fromTo(
        evaluation,
        { opacity: 0, filter: "blur(10px)" },
        { opacity: 0.26, filter: "blur(0px)", duration: 0.72, ease: "power3.out" },
        0,
      );

      tl.fromTo(
        heading,
        { x: -34, clipPath: "inset(0 100% 0 0)" },
        { x: 0, clipPath: "inset(0 0% 0 0)", duration: 0.68, ease: "power4.out" },
        0.35,
      );

      tl.fromTo(
        tag,
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.9,
      );

      const arrivalStarts = [1.82, 1.98, 2.12, 2.24];
      const arrivalDurations = [0.2, 0.17, 0.15, 0.13];

      stats.forEach((stat, index) => {
        tl.set(stat, { opacity: 1, y: index === 0 ? 78 : 50 - index * 4 }, arrivalStarts[index]);
        tl.to(
          stat,
          {
            y: 0,
            duration: arrivalDurations[index],
            ease: "power4.out",
          },
          arrivalStarts[index],
        );
      });

      const countPair = (indices, start) => {
        indices.forEach((index) => {
          tl.to(
            states[index],
            {
              value: targets[index],
              duration: 1.65,
              ease: "power3.out",
              onUpdate: () => {
                values[index].textContent = (Math.round(states[index].value) / 10000).toFixed(4);
              },
            },
            start,
          );
          tl.fromTo(
            values[index],
            { scale: 0.56 },
            { scale: 1, duration: 1.65, ease: "power3.out" },
            start,
          );
          tl.fromTo(
            fills[index],
            { scaleX: 0 },
            { scaleX: proportions[index], duration: 1.65, ease: "power3.out" },
            start,
          );
        });
      };

      countPair([0, 1], 2.42);
      countPair([2, 3], 3.55);

      tl.to(
        evaluation,
        { opacity: 0.13, duration: 0.4, ease: "power2.out" },
        5.5,
      );
      tl.fromTo(
        splitFocus,
        {
          opacity: 0,
          filter: "blur(8px)",
          clipPath: "inset(0 100% 0 0)",
        },
        {
          opacity: 0.78,
          filter: "blur(0px)",
          clipPath: "inset(0 0% 0 0)",
          duration: 0.62,
          ease: "power3.out",
        },
        5.5,
      );
      tl.fromTo(
        claim,
        { y: 32, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.54, ease: "power4.out" },
        5.9,
      );
