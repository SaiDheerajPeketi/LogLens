          document.getElementById("02-replay-incident-ripple-1"),
          document.getElementById("02-replay-incident-ripple-2"),
          document.getElementById("02-replay-incident-ripple-3"),
        ];

        const applyCamera = () => {
          world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;

        const blurProxy = { v: 18 };

          blurNode.setAttribute("stdDeviation", `${blurProxy.v} ${blurProxy.v}`);
        };

        const tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["02-replay-incident"] = tl;

        tl.set(rings, { scale: 0, opacity: 0 }, 0);

        tl.fromTo(
          consoleShell,
          { scale: 1.28, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.58, ease: "power4.out" },
          0.2,
        );
        tl.to(
          blurProxy,
          { v: 0, duration: 0.58, ease: "power4.out", onUpdate: writeBlur },
          0.2,
        );
        tl.fromTo(
          railOne,

          { x: 0, opacity: 1, duration: 0.42, ease: "power3.out" },

          cam,

        tl.to(
          cam,
          {
            scale: 1,
            x: 0,
            y: 0,
            duration: 1.05,
            ease: "power3.inOut",
            onUpdate: applyCamera,
          },
          7.6,
        );
        tl.to(
          [leftSlice, centerSlice, rightSlice],
          { "--dof": "0px", "--light": 1, opacity: 1, duration: 1.05, ease: "power2.inOut" },
          7.6,
        );
        tl.to([scrimTop, scrimBottom], { opacity: 0, duration: 0.72, ease: "power2.inOut" }, 7.6);
        tl.to(timelineFocus, { opacity: 0.24, duration: 0.72, ease: "power2.inOut" }, 7.6);
        tl.to(sourceTarget, { opacity: 0.24, duration: 0.72, ease: "power2.inOut" }, 7.6);
