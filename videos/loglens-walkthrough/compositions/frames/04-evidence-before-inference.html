  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
const frameId = "04-evidence-before-inference";
const root = document.querySelector('[data-composition-id="04-evidence-before-inference"]');
      const outer = document.getElementById(`${frameId}-camera-outer`);
      const inner = document.getElementById(`${frameId}-camera-inner`);
      const surface = document.getElementById(`${frameId}-surface`);
      const target = document.getElementById(`${frameId}-target-row`);
      const lineOverlays = document.getElementById(`${frameId}-line-overlays`);
      const rail = document.getElementById(`${frameId}-focal-rail`);
      const counter = document.getElementById(`${frameId}-counter`);
      const counterSteps = root.querySelectorAll(".f04-counter-step");
      const hingeCopy = document.getElementById(`${frameId}-hinge-copy`);
      const exactLine = document.getElementById(`${frameId}-exact`);
      const redactedLine = document.getElementById(`${frameId}-redacted`);
      const bracketSvg = document.getElementById(`${frameId}-bracket-svg`);
      const bracketPath = document.getElementById(`${frameId}-bracket-path`);
      const evidenceCard = document.getElementById(`${frameId}-evidence-card`);
      const edgeFade = document.getElementById(`${frameId}-edge-fade`);
      const underline = document.getElementById(`${frameId}-fallback-underline`);
      const receiptRows = root.querySelectorAll(".f04-receipt-row");
      const dim = document.getElementById(`${frameId}-dim`);
      const rowLifts = root.querySelectorAll(".f04-row-lift");
      const finalStatement = document.getElementById(`${frameId}-final-statement`);

      const scrollStart = 55;
      const scrollEnd = -109;
      const rootRect = root.getBoundingClientRect();
      const targetRect = target.getBoundingClientRect();
      const targetOffsetX = targetRect.left + targetRect.width / 2 - rootRect.left - 960;
      const targetOffsetY = targetRect.top + targetRect.height / 2 - rootRect.top - 448;
      const counterX = -targetOffsetX;
      const counterY = -targetOffsetY - scrollEnd;
      const maxScale = Math.min(
        (0.88 * 1920) / targetRect.width,
        (0.88 * 896) / targetRect.height,
      );
      const zoomScale = Math.min(2.15, maxScale);
      const pathLength = bracketPath.getTotalLength();
      const holdClock = { value: 0 };

      const tl = gsap.timeline({ paused: true });

      tl.set(outer, { scale: zoomScale, opacity: 1 }, 0);
      tl.set(inner, { x: counterX, y: counterY }, 0);
      tl.set(surface, { y: scrollStart }, 0);
      tl.set(counterSteps, { opacity: 0, y: 0 }, 0);
      tl.set(counterSteps[0], { opacity: 1 }, 0);
      tl.set([hingeCopy, bracketSvg, evidenceCard], { opacity: 0 }, 0);
      tl.set([exactLine, redactedLine], { opacity: 0, y: 18 }, 0);
      tl.set(bracketPath, {
        strokeDasharray: pathLength,
        strokeDashoffset: pathLength,
      }, 0);
      tl.set(underline, { opacity: 0, scaleX: 0 }, 0);
      tl.set(receiptRows, { opacity: 0, x: 30 }, 0);
      tl.set(dim, { opacity: 0 }, 0);
      tl.set(rowLifts, { opacity: 0 }, 0);
      tl.set(finalStatement, { opacity: 0, y: 24 }, 0);

      tl.fromTo(
        outer,
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power2.out" },
        0,
      );
      tl.fromTo(
        rail,
        { opacity: 0, scaleX: 0 },
        { opacity: 0.9, scaleX: 1, duration: 0.45, ease: "power2.out" },
        0.05,
      );
      tl.fromTo(
        counter,
        { opacity: 0, y: -14 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        0.1,
      );

      tl.to(surface, { y: scrollEnd, duration: 4.75, ease: "power2.inOut" }, 0.1);

      const crossings = [0.28, 1.58, 2.72, 3.5, 4.48];
      const lineIds = ["08", "10", "12", "13", "15"];
      lineIds.forEach((lineId, index) => {
        tl.to(
          document.getElementById(`${frameId}-line-${lineId}`),
          { color: "#f1a33c", duration: 0.08, ease: "none" },
          crossings[index],
        );
        if (index > 0) {
          tl.set(counterSteps[index - 1], { opacity: 0 }, crossings[index]);
          tl.fromTo(
            counterSteps[index],
            { opacity: 0, y: 8 },
            { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" },
            crossings[index],
          );
        }
      });

      tl.set(hingeCopy, { opacity: 1 }, 5.0);
      tl.fromTo(
        exactLine,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        5.02,
      );
      tl.fromTo(
        evidenceCard,
        { opacity: 0, x: 34 },
        { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" },
        5.2,
      );
      tl.set(bracketSvg, { opacity: 1 }, 5.2);
      tl.to(
        bracketPath,
        { strokeDashoffset: 0, duration: 0.72, ease: "power1.inOut" },
        5.22,
      );
      tl.fromTo(
        redactedLine,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        6.12,
      );

      tl.to(outer, { scale: 1, duration: 1.15, ease: "power4.out" }, 7.2);
      tl.to(inner, { x: 0, y: 0, duration: 1.15, ease: "power4.out" }, 7.2);
      tl.to(surface, { y: 0, duration: 1.15, ease: "power4.out" }, 7.2);
      tl.to(
        [rail, counter, hingeCopy, bracketSvg, evidenceCard, lineOverlays],
        { opacity: 0, duration: 0.28, ease: "power1.out" },
        7.2,
      );
      tl.to(edgeFade, { opacity: 0.14, duration: 1.15, ease: "power4.out" }, 7.2);

      tl.fromTo(
        underline,
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.5, ease: "power2.out" },
        8.35,
      );
      receiptRows.forEach((row, index) => {
        tl.fromTo(
          row,
          { opacity: 0, x: 30 },
          { opacity: 1, x: 0, duration: 0.42, ease: "power3.out" },
          8.55 + index * 0.45,
        );
      });

      tl.fromTo(
        dim,
        { opacity: 0 },
        { opacity: 0.82, duration: 0.34, ease: "power2.out" },
        10.1,
      );
      tl.to(
        [underline, receiptRows],
        { opacity: 0, duration: 0.25, ease: "power2.in" },
        9.82,
      );
      tl.fromTo(
        rowLifts,
        { opacity: 0 },
        { opacity: 1, duration: 0.24, stagger: 0.045, ease: "power1.out" },
        10.1,
      );
      tl.fromTo(
        finalStatement,
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        10.25,
      );

      tl.to(holdClock, { value: 1, duration: 1.3, ease: "none" }, 10.7);

      window.__timelines = window.__timelines || {};
      window.__timelines[frameId] = tl;
    })();
  </script>
