[project]
name = "loglens"
version = "0.1.0"
description = "Evidence-first log anomaly detection and root-cause analysis"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sai Dheeraj Peketi" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "numpy>=2,<3",
  "openai>=1.50,<3",
  "pandas>=2.2,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "scikit-learn>=1.5,<2",
  "sqlalchemy>=2,<3",
  "uvicorn[standard]>=0.30,<1",
  "xgboost>=2.1,<4",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
loglens = "loglens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/loglens"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["loglens"]
mypy_path = "backend"

